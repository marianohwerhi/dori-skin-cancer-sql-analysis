<svg width="820" height="400" viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="40" y="38" fill="#14181f" font-size="16" font-weight="600">Observed malignancy rate by body region</text>
  <text x="40" y="58" fill="#6b7280" font-size="12.5">Top 6 of 14 regions, by observed rate</text>

  <!-- baseline -->
  <line x1="220" y1="82" x2="220" y2="358" stroke="#e4e6ea" stroke-width="1"/>

  <!-- bars: track width max 520px for 69.1 -> scale = 520/69.1 = 7.526 -->
  <!-- Nose 69.1 (violet — standout finding) -->
  <rect x="220" y="86"  width="520" height="34" rx="4" fill="#5b4fe0"/>
  <text x="205" y="108" fill="#14181f" font-size="13.5" text-anchor="end" font-weight="500">Nose</text>
  <text x="752" y="108" fill="#5b4fe0" font-size="13.5" font-weight="600">69.1%</text>

  <!-- Lip 57.1 -->
  <rect x="220" y="132" width="430" height="34" rx="4" fill="#0c6b54"/>
  <text x="205" y="154" fill="#14181f" font-size="13.5" text-anchor="end">Lip</text>
  <text x="662" y="154" fill="#4b5563" font-size="13.5">57.1%</text>

  <!-- Neck 54.1 -->
  <rect x="220" y="178" width="407" height="34" rx="4" fill="#0c6b54"/>
  <text x="205" y="200" fill="#14181f" font-size="13.5" text-anchor="end">Neck</text>
  <text x="639" y="200" fill="#4b5563" font-size="13.5">54.1%</text>

  <!-- Ear 53.1 -->
  <rect x="220" y="224" width="400" height="34" rx="4" fill="#0c6b54"/>
  <text x="205" y="246" fill="#14181f" font-size="13.5" text-anchor="end">Ear</text>
  <text x="632" y="246" fill="#4b5563" font-size="13.5">53.1%</text>

  <!-- Chest 41.9 -->
  <rect x="220" y="270" width="315" height="34" rx="4" fill="#0c6b54"/>
  <text x="205" y="292" fill="#14181f" font-size="13.5" text-anchor="end">Chest</text>
  <text x="547" y="292" fill="#4b5563" font-size="13.5">41.9%</text>

  <!-- Face 36.7 -->
  <rect x="220" y="316" width="276" height="34" rx="4" fill="#0c6b54"/>
  <text x="205" y="338" fill="#14181f" font-size="13.5" text-anchor="end">Face</text>
  <text x="508" y="338" fill="#4b5563" font-size="13.5">36.7%</text>

  <text x="40" y="386" fill="#6b7280" font-size="11.5">Observed rate within this dataset — not a causal or clinically validated risk estimate.</text>
</svg>
